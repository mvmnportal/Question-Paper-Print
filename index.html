<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --user-msg-bg: #667eea;
            --ai-msg-bg: #f8f9fa;
            --text-dark: #2d3748;
            --text-light: #ffffff;
            --app-bg: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--app-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-dark);
        }

        #app-wrapper {
            width: 100%;
            max-width: 650px;
            height: 85vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Colorful Header */
        header {
            background: var(--primary-gradient);
            padding: 20px;
            text-align: center;
            color: var(--text-light);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            z-index: 10;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* Chat Area */
        #chat-history {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #ffffff;
        }

        .message {
            padding: 12px 18px;
            border-radius: 15px;
            max-width: 80%;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-in-out;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg {
            background-color: var(--user-msg-bg);
            color: var(--text-light);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background-color: var(--ai-msg-bg);
            color: var(--text-dark);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #e2e8f0;
        }

        /* Input Area */
        #input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #edf2f7;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .instructions-text {
            font-size: 0.8rem;
            color: #718096;
            font-weight: 500;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
            outline: none;
        }

        #user-input:focus {
            border-color: #667eea;
        }

        #send-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            transition: transform 0.2s, opacity 0.2s;
        }

        #send-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        #send-btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #a0aec0; }
    </style>
</head>
<body>

<div id="app-wrapper">
    <header>
        <h1>✨ AI Study Assistant</h1>
        <p>Your personal Socratic tutor</p>
    </header>

    <div id="chat-history">
        <div class="message ai-msg">Hello! I am your AI tutor. I won't give you the direct answers, but I will help you figure them out. What are we learning today?</div>
    </div>

    <div id="input-container">
        <span class="instructions-text">Instructions: Type your question or the topic you need help with below.</span>
        <div class="input-row">
            <input type="text" id="user-input" placeholder="Type here..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
    // 🔴 REPLACE THIS WITH YOUR *NEW* GOOGLE AI STUDIO API KEY
    const API_KEY = 'YOUR_NEW_API_KEY_HERE'; 
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    const systemInstruction = "You are a Socratic AI tutor for school students. Your goal is to help students find the answer themselves. Never provide the direct answer to a homework question. Instead, ask guiding questions, break down the concept, and encourage them to think critically.";

    let chatContext = [];

    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const messageText = inputField.value.trim();

        if (!messageText) return;

        appendMessage(messageText, 'user-msg');
        inputField.value = '';
        inputField.disabled = true;
        sendBtn.disabled = true;
        sendBtn.innerText = '...';

        chatContext.push({
            role: "user",
            parts: [{ text: messageText }]
        });

        const payload = {
            system_instruction: { parts: { text: systemInstruction } },
            contents: chatContext
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (data.candidates && data.candidates.length > 0) {
                const aiResponseText = data.candidates[0].content.parts[0].text;
                appendMessage(aiResponseText, 'ai-msg');
                chatContext.push({
                    role: "model",
                    parts: [{ text: aiResponseText }]
                });
            } else {
                appendMessage("Sorry, I didn't understand that.", 'ai-msg');
            }
        } catch (error) {
            console.error("Error calling API:", error);
            appendMessage("Connection error. Please try again.", 'ai-msg');
        } finally {
            inputField.disabled = false;
            sendBtn.disabled = false;
            sendBtn.innerText = 'Send';
            inputField.focus();
        }
    }

    function appendMessage(text, className) {
        const historyDiv = document.getElementById('chat-history');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        
        const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        messageDiv.innerHTML = formattedText;
        
        historyDiv.appendChild(messageDiv);
        historyDiv.scrollTop = historyDiv.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
