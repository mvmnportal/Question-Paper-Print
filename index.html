<!DOCTYPE html>
<html lang="as">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Question Paper - Class 2 Assamese</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tiro+Bangla&display=swap');
        
        body {
            font-family: 'Tiro Bangla', Arial, sans-serif;
            font-size: 16pt;
            color: #000;
            background: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        /* Download Button Style */
        .download-btn {
            display: block;
            width: 250px;
            margin: 0 auto 20px auto;
            padding: 12px 20px;
            font-size: 16pt;
            font-family: 'Tiro Bangla', Arial, sans-serif;
            font-weight: bold;
            color: #fff;
            background-color: #d9381e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.3s;
        }

        .download-btn:hover {
            background-color: #b82d16;
        }

        /* Paper Container */
        .paper-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* Header Styling */
        .header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 3px double #000;
            padding-bottom: 15px;
        }

        .header h1 { font-size: 24pt; margin: 0 0 5px 0; }
        .header h2 { font-size: 18pt; margin: 0 0 15px 0; font-weight: normal; }

        .subject-class {
            text-align: center;
            font-size: 18pt;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            font-size: 16pt;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* Question Blocks */
        .q-block {
            margin-bottom: 45px; 
            page-break-inside: avoid; /* পেজ কাটি যোৱা ৰোধ কৰিব */
        }

        .q-title {
            font-weight: bold;
            margin-bottom: 20px;
        }

        .marks { float: right; font-weight: bold; }

        /* Multiple Choice Options */
        .mcq-options {
            display: flex;
            gap: 30px;
            margin-left: 30px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        /* Picture Questions */
        .pic-question {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            margin-left: 20px;
            page-break-inside: avoid;
        }

        .pic-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 2px solid #000;
            border-radius: 5px;
            margin-right: 25px;
        }

        .pic-text { font-size: 18pt; font-weight: bold; }

        /* Matching Questions */
        .match-wrap {
            display: flex;
            justify-content: space-between; 
            width: 75%; 
            margin: 20px auto;
            font-size: 20pt;
            padding: 0 30px;
        }

        .match-col {
            display: flex;
            flex-direction: column;
            gap: 35px; 
            text-align: center;
            font-weight: bold;
        }
        
        .matra-col div {
            font-family: Arial, sans-serif;
            font-size: 28pt; 
            display: inline-block;
            width: 40px; 
            text-align: center;
            line-height: 1;
        }

        /* Sub-questions */
        .sub-q { margin-bottom: 20px; margin-left: 20px; }
        .poem { margin-left: 50px; font-size: 18pt; line-height: 2; }
        .footer {
            text-align: center;
            font-weight: bold;
            font-size: 18pt;
            margin-top: 60px;
            border-top: 1px solid #000;
            padding-top: 15px;
        }

        /* Print Media Query */
        @media print {
            body { background: none; padding: 0; }
            .paper-container { box-shadow: none; padding: 0; max-width: 100%; }
            .download-btn { display: none; } /* প্ৰিন্ট কৰোঁতে বুটামটো নাহে */
            .pic-img { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<button class="download-btn" onclick="downloadPDF()">⬇ PDF ডাউনলোড কৰক</button>

<div class="paper-container" id="paper-content">
    
    <div class="header">
        <h1>জিত গাওঁ প্ৰাথমিক বিদ্যালয়</h1>
        <h2>প্ৰথম গঠনাত্মক মান নিৰূপণ</h2>
        
        <div class="subject-class">
            <div>বিষয়: অসমীয়া</div>
            <div>শ্ৰেণী: দ্বিতীয়</div>
        </div>

        <div class="meta-info">
            <span>সময়: ২ ঘণ্টা</span>
            <span>মুঠ নম্বৰ: ৫০</span>
        </div>
    </div>

    <div class="q-block">
        <div class="q-title">১। তলৰ প্ৰশ্নসমূহৰ শুদ্ধ উত্তৰটো বিচাৰি লিখা। <span class="marks">১×৫=৫</span></div>
        
        <div class="sub-q">ক) মানুহবোৰে কাক আগুৰি ধৰি আছিল?</div>
        <div class="mcq-options">
            <span>অ) দৰাক</span> <span>আ) ৰিমঝিমক</span> <span>ই) খুৰাক</span> <span>ঈ) পেহীক</span>
        </div>
        
        <div class="sub-q">খ) অসমীয়া ভাষাত মুঠ কিমানটা স্বৰবৰ্ণ আছে?</div>
